<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <form id="expenseForm" class="container mt-4">

        <div class="mb-3">
            <label class="form-label">Choose expense amount: </label>
            <input type="number" id="amount" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Choose description: </label>
            <input type="text" id="description" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Choose a category: </label>
            <select id="category" name="category" class="form-select">
                <option>Food</option>
                <option>entertainment</option>
                <option>Fuel</option>
             <option>Random</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Add expenses</button>
        
        <h2>Expense list</h2>
        <div id="expenseList">

        </div>

    </form>
    <script src="script.js"></script>
</body>
</html>
